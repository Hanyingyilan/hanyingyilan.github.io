name: Static site checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build Pages artifact (no deployment)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - run: node scripts/check-published.mjs _site
      - name: Check published HTTP responses
        run: |
          python3 -m http.server 8124 --bind 127.0.0.1 --directory _site > /tmp/published-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8124/ > /dev/null && break
            sleep 1
          done
          node scripts/check-http.mjs http://127.0.0.1:8124/ --published
